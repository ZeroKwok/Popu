name: Build and publish Python wheel

on:
  release:
    types: [published]
  # Manual runs validate artifacts; they never upload to PyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      wheel: ${{ steps.identity.outputs.wheel }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Python release tools
        run: python -m pip install build twine packaging pytest tomli
      - name: Check release identity before building
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $arguments = @('scripts/verify-python-release.py', '--version-only')
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $arguments += @('--tag', $env:RELEASE_TAG)
          }
          $version = & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $normalized = & python -c 'from packaging.version import Version; import sys; print(Version(sys.argv[1]))' $version
          "wheel=popu-$normalized-py3-none-win_amd64.whl" >> $env:GITHUB_OUTPUT
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            python/build/tools
          key: wheel-windows-msvc-static-v1-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/build-python-wheel.py') }}
          restore-keys: wheel-windows-msvc-static-v1-
      - name: Install build tools
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'popu-tools'
          cargo install just --locked --version 1.44.1 --root $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $tools 'bin') >> $env:GITHUB_PATH
          'C:\Program Files\Git\usr\bin' >> $env:GITHUB_PATH
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick*\magick.exe" | Select-Object -First 1
            $magick.DirectoryName >> $env:GITHUB_PATH
          }
      - name: Prepare checkout and run regression tests
        run: |
          just setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          just check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable native payload and Windows wheel
        run: just build-wheel
      - name: Validate metadata and wheel contents
        env:
          WHEEL: ${{ steps.identity.outputs.wheel }}
        run: |
          $wheels = @(Get-ChildItem dist -File)
          if ($wheels.Count -ne 1 -or $wheels[0].Name -ne $env:WHEEL) {
            throw 'Release output must contain exactly the expected Windows wheel'
          }
          python scripts/verify-python-release.py --wheel "dist/$env:WHEEL" --twine --report test-results/wheel-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: release-dists
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-build-report
          path: test-results/wheel-build.json

  installed-wheel:
    needs: release-build
    # Exercise the finished wheel on GitHub's newest stable Windows image.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/
      - run: python -m pip install packaging tomli
      - name: Verify isolated install without build tools on PATH
        shell: pwsh
        env:
          WHEEL: ${{ needs.release-build.outputs.wheel }}
        run: python scripts/verify-python-release.py --wheel "dist/$env:WHEEL" --smoke --report "test-results/installed-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: installed-wheel-${{ matrix.python }}
          path: test-results/installed-*.json

  pypi-publish:
    if: github.event_name == 'release'
    needs: [release-build, installed-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/popu/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
