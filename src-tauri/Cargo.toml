[package]
name = "popu"
version = "0.1.0"
description = "A small local interaction window for automation and AI agents"
authors = ["Popu contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "popu_lib"
path = "src/lib.rs"

[[bin]]
name = "popu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
thiserror = "2"
interprocess = "2.2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
