<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ipc: http://ipc.localhost"><title>Popu history</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="history.css"></head>
  <body>
    <header><h1>Notification history</h1><button id="clear" class="popu-button popu-button-secondary">Clear history and hidden notifications</button></header>
    <main id="history">
      <aside class="history-list-pane" aria-label="Notification history">
        <p id="history-counts" role="status"></p>
        <p id="history-error" role="alert"></p>
        <div id="history-list" role="list"><p class="empty">Loading history…</p></div>
      </aside>
      <section id="history-detail" class="popu-shell" aria-live="polite"><p class="empty">Select a notification to view its contents.</p></section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
