<section class="popu-shell" data-popu-drag-region role="dialog" aria-modal="true" aria-labelledby="popu-title">
  <div class="popu-heading">
    <div class="popu-icon" data-popu-slot="icon" aria-hidden="true"></div>
    <h1 id="popu-title" class="popu-title" data-popu-slot="title"></h1>
  </div>
  <div class="popu-body" data-popu-scrollable>
    <div class="popu-content" data-popu-selectable data-popu-slot="content"></div>
    <form class="popu-form" data-popu-slot="form" novalidate></form>
  </div>
  <div class="popu-actions" data-popu-slot="actions"></div>
</section>
