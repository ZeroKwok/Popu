<section class="popu-shell" data-popu-drag-region role="status" aria-labelledby="popu-title">
  <button class="popu-close" data-popu-action="close" aria-label="Close">×</button>
  <div class="popu-heading">
    <div class="popu-icon" data-popu-slot="icon" aria-hidden="true"></div>
    <h1 id="popu-title" class="popu-title" data-popu-slot="title"></h1>
  </div>
  <p class="popu-message" data-popu-selectable data-popu-slot="message"></p>
  <div class="popu-details" data-popu-selectable data-popu-slot="details"></div>
  <div data-popu-slot="progress"></div>
</section>
