[build-system]
requires = ["setuptools>=77", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "popu"
dynamic = ["version"]
description = "Desktop notifications and lightweight dialogs for scripts and automation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Popu contributors" }]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3"
]

[project.scripts]
popu = "popu._cli:main"

[project.urls]
Homepage = "https://github.com/ZeroKwok/Popu"
Repository = "https://github.com/ZeroKwok/Popu"
Issues = "https://github.com/ZeroKwok/Popu/issues"
Documentation = "https://github.com/ZeroKwok/Popu#readme"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
popu = ["_native/*"]
"popu.demo" = ["README.md"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
