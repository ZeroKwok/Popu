[build-system]
requires = ["setuptools>=77", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "popu"
dynamic = ["version"]
description = "Popu native notification tool and Python SDK for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Popu contributors" }]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3"
]

[project.scripts]
popu = "popu._cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
popu = ["_native/*"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
